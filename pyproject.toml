[project]
name = "shadowbox"
version = "0.3.2"
description = "Executable architectural model for safe what-if experimentation"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
keywords = ["simulation", "chaos-engineering", "architecture", "reliability", "sre"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
  "Topic :: System :: Systems Administration",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.0",
  "typer>=0.9",
  "rich>=13.0",
  "pyyaml>=6.0",
  "jsonschema>=4.0",
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[project.scripts]
shadowbox = "shadowbox.cli:app"

[project.urls]
Homepage = "https://github.com/Pa004/shadowBox"
Repository = "https://github.com/Pa004/shadowBox"
Issues = "https://github.com/Pa004/shadowBox/issues"
Changelog = "https://github.com/Pa004/shadowBox/releases"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "hypothesis>=6.0",
  "httpx>=0.27",
  "ruff>=0.4",
  "mypy>=1.10",
  "types-PyYAML>=6.0",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Typer defaults and FastAPI Depends are documented framework patterns.
"src/shadowbox/cli.py" = ["B008"]
"src/shadowbox/api.py" = ["B008"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shadowbox"]
