name: ci

on:
  push:
  pull_request:

jobs:
  m0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run pytest
      - run: uv run shadowbox validate examples/checkout/model.yaml --scenario examples/checkout/scenarios/db-failure.yaml
      - run: uv run shadowbox import --from examples/checkout/docker-compose.yaml --out /tmp/imported.yaml
      - run: uv run shadowbox validate /tmp/imported.yaml --scenario scenarios/db-down.yaml
      - run: uv run shadowbox simulate examples/checkout/model.yaml --scenario scenarios/queue-overflow.yaml --seed 42 --out /tmp/report.json
      - run: uv run shadowbox simulate examples/checkout/model.yaml --scenario examples/checkout/scenarios/db-failure.yaml --seed 42 --out /tmp/base.json
      - run: uv run shadowbox compare --a /tmp/base.json --b /tmp/base.json
      - run: uv run shadowbox report /tmp/report.json --format text

  studio:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install
      - run: npm run build
