<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ShadowBox demo</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main>
    <h1>ShadowBox demo</h1>
    <p>What-if simulation against the bundled checkout model. Results are illustrative, not predictions.</p>
    <label>API base <input id="api" value="http://127.0.0.1:8000" size="32" /></label>
    <div>
      <button id="run">Run baseline vs db-down</button>
    </div>
    <pre id="out">Press Run.</pre>
    <h2>Replay (sampled requests)</h2>
    <label>t = <span id="tlabel">0</span>s <input id="time" type="range" min="0" max="60" value="0" step="1" /></label>
    <svg id="graph" width="680" height="220" role="img" aria-label="Component graph"></svg>
    <pre id="replay">Run first, then scrub time.</pre>
  </main>
  <script src="./app.js"></script>
</body>
</html>
